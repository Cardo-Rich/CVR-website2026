name: Deploy to Firebase Hosting (live)

# Runs when a PR is merged (i.e. a push lands on main), manually via the
# Actions tab, or on request from the CMS functions (a published or drafted
# Journal article needs its static page built). Builds the Astro site and
# deploys it to the live Firebase Hosting channel.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosting_only:
        description: 'Rebuild and deploy hosting only; skip the functions job'
        type: string
        default: 'false'
      reason:
        description: 'What requested this deploy (informational)'
        type: string
        default: ''

# Content saves can request several deploys in a row. GitHub keeps at most one
# run in progress and one queued per group, so they collapse rather than pile
# up, and a running deploy is never cancelled part way.
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:all
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDO_WEBSITE_2026 }}
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDO_WEBSITE_2026 }}
          projectId: cardo-website-2026
          channelId: live

  # Deploys Cloud Functions (booking proxy, CMS content API, reviews sync,
  # Journal article editing). Requires these Firebase secrets to EXIST first
  # (the sync step below creates them from GitHub secrets): RESEND_API_KEY,
  # GHL_API_TOKEN, GOOGLE_PLACES_API_KEY, GITHUB_DEPLOY_TOKEN. Non-secret GHL
  # params live in functions/.env.cardo-website-2026 (committed).
  # Skipped for hosting-only dispatches from the CMS.
  deploy_functions:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.hosting_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
      # Mirror function secrets from GitHub secrets into Google Secret Manager
      # so they can be managed entirely from the GitHub UI. Each runs only
      # when the GitHub secret is set.
      - name: Sync function secrets
        env:
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          # Fine-grained PAT, Actions: read and write on this repo. Lets the
          # CMS request a rebuild when an article is saved or published.
          GITHUB_DEPLOY_TOKEN: ${{ secrets.GITHUB_DEPLOY_TOKEN }}
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDO_WEBSITE_2026 }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          for NAME in GHL_API_TOKEN GOOGLE_PLACES_API_KEY GITHUB_DEPLOY_TOKEN; do
            VALUE="${!NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" | npx firebase-tools@13.35.1 functions:secrets:set "$NAME" --project cardo-website-2026 --data-file=- --force || exit 1
            elif ! npx firebase-tools@13.35.1 functions:secrets:access "$NAME" --project cardo-website-2026 >/dev/null 2>&1; then
              # Seed a placeholder so deploy can bind the secret; the functions
              # treat the value "unset" as not configured.
              printf 'unset' | npx firebase-tools@13.35.1 functions:secrets:set "$NAME" --project cardo-website-2026 --data-file=- --force || exit 1
              echo "::warning::$NAME not set in GitHub secrets — placeholder created; the matching feature stays disabled until you add it."
            fi
          done
      - name: Deploy functions
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CARDO_WEBSITE_2026 }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase-tools@13.35.1 deploy --only functions --project cardo-website-2026 --non-interactive --force
