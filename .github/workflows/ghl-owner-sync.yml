name: GHL owner sync

# Keeps each property's Owner association in HighLevel in step with its
# Property Relationship records (type Owner, status Current, no end date).
# The relationship records are the source of truth; nobody edits Owner by
# hand. Runs twice an hour, plus manually via the Actions tab. Skips with a
# warning until the GHL_OWNER_SYNC_TOKEN repository secret exists.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency: ghl-owner-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ghl:owner-sync -- --apply
        env:
          GHL_OWNER_SYNC_TOKEN: ${{ secrets.GHL_OWNER_SYNC_TOKEN }}
